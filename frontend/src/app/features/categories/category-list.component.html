<header class="page-header page-header--row">
  <div>
    <h1>Categories</h1>
    <p>{{ categories().length }} categor(ies)</p>
  </div>
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    New category
  </button>
</header>

<div class="table-card mat-elevation-z1">
  <table mat-table [dataSource]="categories()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let c">{{ c.name }}</td>
    </ng-container>

    <ng-container matColumnDef="uniqueId">
      <th mat-header-cell *matHeaderCellDef>Unique ID</th>
      <td mat-cell *matCellDef="let c"><code class="uuid">{{ c.uniqueId }}</code></td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Created</th>
      <td mat-cell *matCellDef="let c">{{ c.createdAt | date: 'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="col-actions">Actions</th>
      <td mat-cell *matCellDef="let c" class="col-actions">
        <button mat-icon-button matTooltip="Edit" (click)="openEdit(c)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" matTooltip="Delete" (click)="delete(c)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (!loading() && categories().length === 0) {
    <div class="empty-state">
      <mat-icon>category</mat-icon>
      <p>No categories yet. Create your first category.</p>
    </div>
  }
</div>
