<header class="page-header page-header--row">
  <div>
    <h1>Users</h1>
    <p>{{ users().length }} user(s)</p>
  </div>
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    New user
  </button>
</header>

<div class="table-card mat-elevation-z1">
  <table mat-table [dataSource]="users()">
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let u">{{ u.email }}</td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Created</th>
      <td mat-cell *matCellDef="let u">{{ u.createdAt | date: 'medium' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="col-actions">Actions</th>
      <td mat-cell *matCellDef="let u" class="col-actions">
        <button mat-icon-button matTooltip="Edit" (click)="openEdit(u)">
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          matTooltip="Delete"
          [disabled]="u.id === currentUserId"
          (click)="delete(u)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (!loading() && users().length === 0) {
    <div class="empty-state">
      <mat-icon>group</mat-icon>
      <p>No users found.</p>
    </div>
  }
</div>
