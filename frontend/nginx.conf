server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip static assets for faster loads.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-cache fingerprinted build assets (they have content hashes in the name).
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Reverse-proxy API calls to the backend service (same-origin → no CORS).
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Large uploads (bulk import) and long streamed downloads (reports).
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    client_max_body_size 60m;
  }

  # Serve uploaded product images through the backend.
  location /uploads/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
  }

  # SPA fallback: any unknown path serves index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
