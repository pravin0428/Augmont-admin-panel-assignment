# Render Blueprint — provisions the whole stack from this repo.
#
#   Render Dashboard → New → Blueprint → pick this repo → Apply.
#
# Creates: a PostgreSQL database + a Dockerized backend API + a Dockerized
# frontend (nginx) that reverse-proxies /api and /uploads to the backend over
# Render's private network (so the browser stays same-origin → no CORS).
#
# NOTE (free tier): services sleep after ~15 min idle (cold start on next hit),
# and the free PostgreSQL instance is removed ~30 days after creation. Uploaded
# image files are NOT persisted across redeploys on free (no disk); product data
# lives safely in Postgres. Bump `plan:` to a paid tier to remove these limits.

databases:
  - name: augmont-db
    plan: free
    databaseName: product_db
    region: oregon

services:
  # ── Backend API (Express + Prisma) ─────────────────────────────────────────
  - name: augmont-backend
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Migrations run on startup via the container entrypoint (prisma migrate deploy).
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      # DATABASE_URL is injected from the managed database above.
      - key: DATABASE_URL
        fromDatabase:
          name: augmont-db
          property: connectionString
      # A strong secret is generated by Render (never committed).
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_IMAGE_SIZE_BYTES
        value: "2097152"
      - key: BULK_IMPORT_BATCH_SIZE
        value: "500"
      # With the nginx proxy the app is same-origin, so CORS is effectively
      # unused; set to the frontend URL as a best-effort for direct API access.
      - key: CORS_ORIGINS
        value: https://augmont-frontend.onrender.com
      # PORT is provided by Render automatically; the server binds to it.

  # ── Frontend (Angular SPA served as a static site from Render's CDN) ────────
  # WHY static (not a container): it's Render's recommended way to host an SPA —
  # the build runs on Render's builder (no in-container Angular OOM) and there's
  # no nginx/private-DNS to fail. It calls the backend's PUBLIC URL with CORS
  # (see environment.render.ts + the backend's CORS_ORIGINS above).
  - name: augmont-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build -- --configuration render
    staticPublishPath: dist/frontend/browser
    # SPA fallback: unmatched paths serve index.html (existing files served first).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
